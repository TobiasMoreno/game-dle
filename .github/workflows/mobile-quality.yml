name: Mobile quality gate

on:
  pull_request:
    branches:
      - main
      - mobile
  push:
    branches:
      - mobile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm run test:ci

      - name: Build and sync Android
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Validate store package
        run: npm run store:validate

      - name: Compile debug APK and optimized unsigned AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-dle-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync iOS
        run: |
          npm run build:mobile
          npx cap sync ios

      - name: Compile iOS simulator app without signing
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
